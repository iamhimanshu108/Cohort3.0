<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <h1>Razorpay Payment Gateway</h1>

    <label for="product-select">Choose a product:</label>
    <select id="product-select">
      <option value="">Loading products...</option>
    </select>
    <button id="rzp-button1" disabled>Pay</button>
    <p id="payment-status" role="status"></p>

    <script>
      const productSelect = document.getElementById("product-select");
      const payButton = document.getElementById("rzp-button1");
      const paymentStatus = document.getElementById("payment-status");

      async function loadProducts() {
        try {
          const { data: products } = await axios.get("/api/payments/products");
          productSelect.replaceChildren();

          if (products.length === 0) {
            productSelect.add(new Option("No products available", ""));
            paymentStatus.textContent =
              "No products found. Run npm run seed, then refresh this page.";
            return;
          }

          productSelect.add(new Option("Select a product", ""));
          products.forEach((product) => {
            productSelect.add(
              new Option(
                `${product.title} - ${product.price.currency} ${product.price.amount}`,
                product._id,
              ),
            );
          });
          payButton.disabled = false;
        } catch (error) {
          productSelect.replaceChildren(new Option("Unable to load products", ""));
          paymentStatus.textContent =
            error.response?.data?.message || "Could not load products. Check that the server is running.";
        }
      }

      async function payNow() {
        const productId = productSelect.value;
        if (!productId) {
          paymentStatus.textContent = "Select a product before paying.";
          return;
        }

        payButton.disabled = true;
        paymentStatus.textContent = "Creating payment order...";
        try {
          const { data } = await axios.post(
            `/api/payments/${productId}/order`,
          );
          const rzp = new window.Razorpay({
            key: data.keyId,
            order_id: data.orderId,
            amount: data.amount,
            currency: data.currency,
            name: "Kapda Co.",
            description: `Payment for ${productSelect.selectedOptions[0].text}`,

            handler: async function (paymentResponse) {
              paymentStatus.textContent = "Verifying payment...";
              try {
                const verify = await axios.post(
                  `/api/payments/${data.orderId}/verify`,
                  paymentResponse,
                );
                paymentStatus.textContent =
                  verify.data.status === "success"
                    ? "Payment successful."
                    : "Payment verification failed.";
              } catch (error) {
                paymentStatus.textContent =
                  error.response?.data?.message || "Could not verify payment.";
              }
            },
          });

          rzp.on("payment.failed", (event) => {
            paymentStatus.textContent =
              event.error?.description || "Payment failed.";
          });
          rzp.open();
        } catch (error) {
          paymentStatus.textContent =
            error.response?.data?.message || "Could not create payment order.";
        } finally {
          payButton.disabled = false;
        }
      }

      payButton.addEventListener("click", payNow);
      loadProducts();
    </script>
  </body>
</html>
